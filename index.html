<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aghigh Gold Atelier</title>
  <meta name="description" content="Aghigh Gold — AI agent command center (demo)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%271 1 148 148%27%3E%3Cpath d=%27M75.1,3c39.8,0,71.9,32.3,71.8,72.2c-0.1,39.8-32.4,71.8-72.4,71.7C34.8,146.9,2.8,114.5,3,74.5C3.1,35,35.4,3,75.1,3z%27 fill=%27%23CB9B2D%27/%3E%3Cpath d=%27M49.2,33.9c4.2-0.9,7,0.2,8.2,6.3c1.7,8.6,10.5,14.1,19.6,13.9c9.1-0.1,16.9-5.9,18.9-14.8%20c1-4.5,2.7-5.6,7.2-5.5c11.3,0.4,11.5,0.4,7.9,11.4C105.8,60.6,92.1,70.1,75,70c-13-0.1-22.1,8.5-22,20.6%20c0.1,10.2,7.8,18.5,18.7,20c8.9,1.2,19.2-5.4,21-14.7c1-5.2,3.3-6,7.9-5.8c10.3,0.4,10.3,0.1,7.4,10.2%20c-4.1,14.4-16.7,24.8-31.4,25.9c-16.2,1.2-30-6.9-36.6-21.5c-6.1-13.6-3-30,8.2-40.3c3.2-2.9,3.4-4.3,0.4-7.5%20c-4.6-4.9-6.9-11.1-8-17.9c-0.7-4,0-5.6,4.2-5.1C46,34.1,47.2,33.9,49.2,33.9z%27 fill=%27%23fff%27/%3E%3C/svg%3E" />
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>
  <canvas id="dust"></canvas>

  <!-- vault intro -->
  <div id="boot">
    <div class="boot-inner">
      <div class="boot-brand">
        <span class="caps muted en">Est. Yazd · Three decades of gold</span>
        <h1 class="gold-text">طلای عقیق</h1>
        <span class="sub en">AGHIGH GOLD · ATELIER INTELLIGENCE</span>
      </div>
      <div class="vault" id="vault">
        <svg viewBox="0 0 400 400" id="vaultSvg"></svg>
        <button class="seal" id="seal" aria-label="ورود"></button>
      </div>
      <div class="boot-hint" id="bootHint">برای ورود روی <b class="gold-text">مهر طلایی</b> بزنید</div>
      <div class="boot-log" id="bootLog"></div>
    </div>
  </div>

  <div class="flash" id="flash"></div>
  <div class="iris" id="iris"></div>
  <div class="curtain" id="curtain"><div class="bar"></div><div class="lbl" id="curtainLbl"></div></div>
  <div class="toasts" id="toasts"></div>
  <div class="cursor" id="cursor"></div><div class="cursor-dot" id="cursorDot"></div>
  <div class="sweep" id="sweep"><i></i></div>

  <div id="app">
    <aside class="side">
      <div class="brand"><div class="mark"></div><div><div class="t1 gold-text">طلای عقیق</div><div class="t2 en">ATELIER · AI</div></div></div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <div class="agent-pulse">
          <div class="row"><span>ایجنت‌ها</span><span><span class="dot"></span> ۱۳ فعال</span></div>
          <div class="row"><span>رایورز</span><span class="up">همگام</span></div>
          <div class="row"><span>بار پردازش</span><span class="num" id="load">۳۸٪</span></div>
        </div>
      </div>
    </aside>
    <header class="top">
      <div class="mbrand"><div class="mark"></div><b class="gold-text">طلای عقیق</b></div>
      <div class="ticker"><div class="ticker-track" id="ticker"></div></div>
      <div class="top-actions">
        <div class="roles" id="roles"><span class="pill"></span></div>
        <div class="clock"><div class="t num" id="clockT"></div><div class="d" id="clockD"></div></div>
        <button class="iconbtn" id="muteBtn" title="صدا"></button>
        <button class="iconbtn" id="bellBtn" title="اعلان‌ها"></button>
        <div class="me"><div class="avatar">م</div></div>
      </div>
    </header>
    <main id="main"></main>
  </div>
  <nav class="mobile-nav" id="mnav"></nav>

  <div class="dock" id="dock">
    <div class="orbwrap" id="orbBtn" title="بازرس ویژه (Space)"><canvas id="orb"></canvas></div>
    <div class="say" id="say">بازرس ویژه <kbd>Space</kbd></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
